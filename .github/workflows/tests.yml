name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Configure LLVM for native task model tests
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          $clang = Join-Path $llvmBin 'clang++.exe'
          if (-not (Test-Path -LiteralPath $clang -PathType Leaf)) {
            throw "LLVM compiler is missing: $clang"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $clang --version
          if ($LASTEXITCODE -ne 0) {
            throw 'LLVM compiler version check failed'
          }

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check driver tests

      - name: Format check
        run: python -m ruff format --check driver tests

      - name: Type check
        run: python -m mypy

      - name: Unit tests (no game required)
        run: python -m unittest discover -s tests -v
