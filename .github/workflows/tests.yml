name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check driver tests

      - name: Format check
        run: python -m ruff format --check driver tests

      - name: Type check
        run: python -m mypy

      - name: Unit tests (no game required)
        run: python -m unittest discover -s tests -v
