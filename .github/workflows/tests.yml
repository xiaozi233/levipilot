name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests (no game required)
        run: python -m unittest discover -s tests -v
