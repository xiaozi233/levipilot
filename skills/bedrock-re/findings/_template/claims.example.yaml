# claims 示例：直接复制此文件后改。
# `driver/landing.py claim --case <case> --file claims.yaml` 接受 {claims: [...]} 或单个对象。
# `confirmed` 必须同时有静态证据等级和 static_closure；否则 claim 会被拒绝。

claims:
  - hypothesis: "阻力系统在同 tick 的写位之后读到新 ADF 位"
    result: confirmed
    evidence_tier: code
    static_closure: "E14 主 pass 注册序：ActionSprintTrigger 早于水阻力；集合追加 + 正序"
    evidence: "[代码] 注册点顺序与集合实现；[实测] 20 帧栈只用于定位主 pass"
    roles:
      "@set_sprinting": "0x14B17C820"
      "@water_drag": "0x142DEE630"
    probe_ref: r01-001
    published: docs/fluid-movement.md#91-tick-内调度顺序的证据等级2026-10-27
    next: "复核 catchup pass 是否读到同一状态"

